# Automatically creates a release when changes land on main.
#
# Version increment is inferred from conventional commit messages since the last tag:
# - "BREAKING CHANGE" or "!:" anywhere -> major
# - "feat:" prefix -> minor
# - Everything else -> patch
#
# Prerequisites:
# 1) Create and add a deploy key with write access for this repository.
# 2) Save the private key as secret RELEASE_DEPLOY_KEY.
# 3) Optional: set RELEASE_DEPLOY_KNOWN_HOSTS.
# 4) If branch protections require PR-only, allow this deploy-key actor as a bypass actor.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Auto-release on merge
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'Release ')"
    permissions:
      contents: write

    steps:
      - name: Validate release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "Error: RELEASE_DEPLOY_KEY is not set."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ssh-known-hosts: ${{ secrets.RELEASE_DEPLOY_KNOWN_HOSTS }}
          ssh-strict: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate package version against latest tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            exit 0
          fi

          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          TAG_VERSION="${LAST_TAG#v}"

          node - "$PACKAGE_VERSION" "$TAG_VERSION" <<'NODE'
          const [pkg, tag] = process.argv.slice(2);

          function compareSemver(left, right) {
            const leftParts = left.split('.').map(Number);
            const rightParts = right.split('.').map(Number);
            for (let index = 0; index < 3; index += 1) {
              const delta = (leftParts[index] ?? 0) - (rightParts[index] ?? 0);
              if (delta !== 0) return Math.sign(delta);
            }
            return 0;
          }

          const comparison = compareSemver(pkg, tag);
          if (comparison < 0) {
            console.error(`package.json version ${pkg} is behind latest tag ${tag}.`);
            console.error('Do not rerun stale release jobs after a newer tag already exists.');
            process.exit(1);
          }
          NODE

      - name: Determine version increment
        id: increment
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s %b")
          else
            COMMITS=$(git log --pretty=format:"%s %b" "${LAST_TAG}..HEAD")
          fi

          if echo "$COMMITS" | grep -qiE "(BREAKING CHANGE|!:)"; then
            echo "increment=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?[!]?:"; then
            echo "increment=minor" >> "$GITHUB_OUTPUT"
          else
            echo "increment=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx release-it --ci --increment=${{ steps.increment.outputs.increment }}
